<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14378F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ডেলিভারি বন্ধু</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#14378F;--org:#F28C1B;--red:#EF4B23;--bg:#F4F6FB;--ink:#16224A;--mut:#5F6B8A;--line:#DCE2F0;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#dfe5f3;color:var(--ink);font:400 16px/1.5 "Hind Siliguri",system-ui,sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--org);outline-offset:2px}
.phone{max-width:480px;min-height:100dvh;margin:0 auto;background:var(--bg);position:relative;overflow:hidden}
/* splash */
#splash{position:fixed;inset:0;z-index:20;max-width:480px;margin:0 auto;background:linear-gradient(#2E7BF0,#BFE0FF 55%,#EAF4FF);display:flex;flex-direction:column;align-items:center;padding-top:env(safe-area-inset-top);cursor:pointer;transition:opacity .4s}
#splash.out{opacity:0;pointer-events:none}
.lg{width:70%;max-width:300px;margin-top:9vh;filter:drop-shadow(0 10px 16px #14378F44)}
.logo{font-weight:700;line-height:1.05;text-align:center;font-size:56px;color:var(--navy);margin-top:6px;font-style:italic}
.logo b{display:block;color:var(--red);font-size:64px}
.pill{background:var(--navy);color:#fff;border-radius:40px;padding:10px 22px;text-align:center;margin:14px 18px;transform:rotate(-2deg)}
.wave{margin-top:auto;width:100%;background:var(--navy);color:#fff;text-align:center;padding:26px 0 calc(22px + env(safe-area-inset-bottom));font-style:italic;font-size:20px;border-top:7px solid var(--org)}
/* header */
.hd{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 18px;border-radius:0 0 26px 26px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.top h1{margin:0;font-size:26px;font-style:italic}.top h1 b{color:var(--org)}.top h1 img{width:36px;height:36px;vertical-align:middle;margin-right:7px}
.ic{background:none;border:0;color:#fff;font-size:26px;position:relative;width:44px;height:44px}
.badge{position:absolute;top:2px;right:0;background:#E5252A;color:#fff;font-size:12px;font-weight:700;border-radius:99px;min-width:19px;height:19px;line-height:19px;text-align:center}
.search{display:flex;align-items:center;background:#fff;border-radius:99px;padding:0 16px;gap:10px;color:var(--ink)}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;padding:12px 0;outline:0;color:var(--ink)}
main{padding:14px 14px calc(90px + env(safe-area-inset-bottom))}
/* banner */
.ban{position:relative;border-radius:18px;overflow:hidden;height:150px;background:linear-gradient(120deg,#7CC4FF,#D7EEFF)}
.sl{position:absolute;inset:0;display:flex;align-items:center;opacity:0;transition:opacity .5s;padding:0 14px}
.sl.on{opacity:1}
.sl svg{width:44%;flex:none}
.sl div{flex:1;text-align:center;font-weight:700;font-size:21px;line-height:1.25;color:var(--navy);font-style:italic}
.sl div em{color:var(--red);display:block}
.sl div span{display:block;font-size:14px;font-weight:500;background:var(--navy);color:#fff;border-radius:99px;padding:5px 10px;margin-top:8px;font-style:normal}
.dots{display:flex;justify-content:center;gap:7px;margin:8px 0 12px}
.dots i{width:8px;height:8px;border-radius:50%;background:#C5CCE0}.dots i.on{background:var(--navy)}
.q{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.q button{border:0;border-radius:16px;padding:12px 2px 10px;font-weight:500;font-size:15px;line-height:1.2}
.q span{display:block;font-size:34px;line-height:1.2}
h2{font-size:18px;margin:18px 2px 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 a{font-size:14px;font-weight:500;color:var(--navy)}
.feat{display:grid;grid-template-columns:repeat(4,1fr);background:#E9EEFB;border-radius:16px;padding:12px 0;text-align:center;font-size:14px;line-height:1.2}
.feat div+div{border-left:1px solid var(--line)}.feat span{display:block;font-size:28px}
.cat{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cat button{background:#E9EEFB;border:0;border-radius:14px;padding:10px 0 8px;font-size:13px}.cat span{display:block;font-size:34px;line-height:1.2}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{background:none;border:0;padding:8px 0 5px;font-size:12.5px;color:var(--mut);position:relative}
nav svg{display:block;margin:0 auto;width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=true]{color:var(--navy);font-weight:700}
nav .badge{left:55%;right:auto;top:3px;background:var(--red)}
/* inner screens */
.bar{background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 8px 14px;display:flex;align-items:center;gap:4px;border-radius:0 0 22px 22px}
.bar b{font-size:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 15px;width:100%;text-align:left;background:none;border:0}
.row+.row{border-top:1px solid var(--line)}.row small,.m{color:var(--mut);font-size:14px;line-height:1.3;display:block}
.chip{font-size:13px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--org);color:#fff;white-space:nowrap}.chip.d{background:#13896F}.chip.h{background:#8793B3}
.st{padding:15px 17px;background:var(--org);color:#fff}.st.d{background:#13896F}.st b{font-size:20px;display:block}
.map svg{display:block;width:100%;background:#E4EEFB}
.sec{padding:15px 17px;border-top:1px solid var(--line)}
ol{list-style:none;margin:0;padding:0}li{position:relative;padding:0 0 16px 32px}li:last-child{padding:0}
li::before{content:"";position:absolute;left:9px;top:22px;bottom:-2px;width:2px;background:var(--line)}li:last-child::before{display:none}li.on::before{background:#13896F}
li i{position:absolute;left:0;top:3px;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);background:#fff}
li.on i{background:#13896F;border-color:#13896F}li.now i{background:var(--org);border-color:var(--org);box-shadow:0 0 0 5px #F28C1B44}li.off{color:var(--mut)}
li small{color:var(--mut);font-size:14px;display:block;line-height:1.3}
label{display:block;font-weight:600;margin:12px 0 4px}
.f{width:100%;font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.btn{display:block;width:100%;margin-top:18px;border:0;border-radius:14px;background:var(--org);color:#fff;font-weight:700;font-size:18px;padding:13px}
.call{background:var(--org);color:#fff;text-decoration:none;font-weight:600;padding:8px 16px;border-radius:10px}
.soon{text-align:center;padding:60px 20px;color:var(--mut)}.soon span{font-size:56px;display:block}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
</style>
</head>
